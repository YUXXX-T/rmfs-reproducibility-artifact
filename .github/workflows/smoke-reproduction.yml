name: smoke-reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/**"
      - "scripts/**"
      - "configs/**"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-artifact.txt
      - run: python scripts/reproduce_tables.py
      - run: python scripts/reproduce_figures.py --figure fig05
      - run: python scripts/compare_generated.py
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-fig05-and-tables
          path: artifacts/generated
