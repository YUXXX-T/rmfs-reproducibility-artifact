schema_version: runtime_contract_v2
dedicated_latency_benchmark_available: true
benchmark: six_station_mid_heldout
layout: map20_r48_s6
load: mid
seeds: {start: 721, stop_exclusive: 731, count: 10}
ticks_per_run: 1500
paired_arrival_replay: true
