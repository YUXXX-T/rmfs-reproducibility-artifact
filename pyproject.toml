[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmfs-wm-artifact"
version = "0.1.0"
description = "Anonymous reproducibility artifact for congestion-robust RMFS dispatch"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Anonymous Authors"}]
dependencies = [
  "numpy>=1.21",
  "matplotlib>=3.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5"]
simulation = [
  "torch>=2.0",
  "pydantic>=1.8.2,<2",
  "pandas>=1.4",
  "scipy>=1.8",
  "psutil>=5.7",
  "threadpoolctl>=2.0",
  "colorlog",
  "tensorboard",
  "tensorboardX",
  "tabulate>=0.8.7",
  "protobuf>=3.20.3",
  "pyarrow",
  "loguru",
]

[project.scripts]
rmfs-artifact = "rmfs_artifact.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "Config*", "Debug*", "Engine*", "Env*", "Metrics*", "Policies*",
  "Visualization*", "WorldModel*", "WorldState*", "rmfs_artifact*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 96
